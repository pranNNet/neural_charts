# Model Parameters
# Read by ----- / ----- / Sod_Shock_Tube_Validation.py (all take --config).
name: test_model_1D
architecture:
  ablation:
    geometry: levelset  # levelset | none
    jump_mode: RH       # RH | free
    fourier: "on"       # on | off
    head: softplus      # softplus | linear
  latent:
    z_geo: 4
    z_field: 32
  coordinate_input: 2 # D+1: 2 for (x, t), 3 for (x, y, t)

encoder:
  encodernet:
    input: 1
    hidden_layers: [64, 64, 64]

geometry:
  norm_delta: 1.0e-2      # delta in phi_hat, x~ units
  fourierfeatures:
    seed: 0 # 2D: add sigma_y to each band
    bands:
      - {n_freq: 16, sigma_x: 1.0, sigma_t: 0.5}
  geometrynet:
    hidden_layers: [128, 128, 128]
    phi_output: 5

field:
  eps: 0.004
  fourierfeatures:
    seed: 1
    bands:
      - {n_freq: 22, sigma_x: 1.0,  sigma_t: 0.5}
      - {n_freq: 21, sigma_x: 3.0,  sigma_t: 1.0}
      - {n_freq: 21, sigma_x: 10.0, sigma_t: 2.0}
  fieldnet:
    regions: 5 #number of zones, also listed as K
    hidden_layers: [128, 128, 128, 128]
    field_output: 3 # (rho, v, p); 4 in 2D: (rho, vx, vy, p)
    N_dist: 4 #distance features per interface
    N_e: 8 # N_e-number ID for each zone k
    

physics:
  constants:
    gamma: 1.4
  jump: 
    Mn_gate: 1.05
    width: 0.03125  # x~, constraint at full strength out to here (8 cells); must be >= side_offset. Guess to tune
    taper: 0.015625 # x~, cosine taper to 0 after width (4 cells). Guess to tune
  fronts:
    k: 3.125 #L/(2*T_ref*u_ref)
    tau_p: 0.10 #pressure-rise threshold for definingn a front as shock
    side_offset: 0.015625 # = 4 cells in x~ (4 · 2/512)
    t_min: 0.125 # t~ = 0.02 / 0.16
  scaling:
    rho_ref: 0.1
    u_ref: 1.0 #fill in with speed of sound
    P_ref: 0.1  # SOD
    Lx: 1.0
    Ly: 1.0
    t_ref: 0.24

