# Model Parameters
# Read by ----- / ----- / Sod_Shock_Tube_Validation.py (all take --config).

architecture:
  ablation:
    geometry: levelset  # levelset | none
    jump_mode: free      # RH | free

data:
  t0: 0.02              # rollout start, after the waves separate

split:
  train:
    batch_size: 128
  validate:
    batch_size: 80

geometry:
  epochs: 500
  lr: 1.0e-3            # AUDIT 8 ⚑ was 1e-2; plan §7.4 has 1e-3. Keep it if the stage 1 loss stays smooth
  lr_min: 1.0e-5
  warmup_steps: 2000
                        # AUDIT 5: eps0 and eps_min removed (no eps in the losses)
  lambda_ce: 1.0        # unused: stage 1 is now the distance-target Huber loss alone (kappa 4, clip 3, in helper.py)

field:
  epochs: 750
  lr: 1.0e-3            # was 5e-3: stage 2 diverged at the warmup peak (train L1 0.005 -> 0.065, never recovered)
  lr_min: 1.0e-5
  warmup_steps: 2000

# geometry_refit removed: nothing is shared between the geometry and the fields

finetune:
  epochs: 300
  geo_lr: 3.0e-5         # was 1e-4: the old stage 3 geometry grad grew 0.2 -> 2+ and the front loss rose; slower geometry
  field_lr: 1.0e-4
  lr_min: 1.0e-6
  lambda_ce: 1.0        # was 0.1 (tuned for CE). ⚑ weight on the distance-target front loss at n + n+1 (was CE + boundary; Huber values are much smaller, watch stage3/loss/front)

rollout:                # stage 4
  R: [2, 4]             # AUDIT: R = 8 runs out of memory
  epochs_per_R: 140     # ⚑ about 10k steps per R at 70 steps/epoch
  lr: 1.0e-4            # AUDIT ⚑ was 3e-4, 3x stage 3's lr with no warmup on a converged model
  lr_min: 1.0e-6
  detach: false         # true cuts the graph between steps: no gradient through the model's own input
  lambda_ce: 1.0        # was 0.1. ⚑ distance-target front loss at n and n+1 per step, as in stage 3; without it the fronts drift

misc:
  grad_clip: 1.0
  noise_std: 0.01       # ⚑ input noise in stages 2-3, as a fraction of each variable's std

path:
  data_path: ./data/step1_sod_pr.h5
  save_path: ./results/models