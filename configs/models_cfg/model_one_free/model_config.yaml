# Model Parameters
# Read by ----- / ----- / Sod_Shock_Tube_Validation.py (all take --config).
name: test_model_free_1D
architecture:
  ablation:
    geometry: levelset  # levelset | none
    jump_mode: free      # RH | free
    head: softplus      # softplus | linear
  coordinate_input: 1   # D: 1 for x, 2 for (x, y). t is not an input
  N_grid: 512           # cells; was encoder.N_grid (LOCAL FIELDS: no encoder, no latents)

geometry:                 # AUDIT 3: norm_delta removed (no phi_hat normalization)
  feature_cnn:            # LOCAL GEOMETRY: GeoFeatureCNN on W(t_n), stride 1, replicate padding; replaces Fourier(x~) + z_geo
    conv_channels: [64, 64, 64]   # ⚑ guess; plus a last linear conv into N_feat, so 4 layers
    N_feat: 32            # ⚑ guess
    kernel: 5             # 4 layers x (kernel // 2) = +-8 cells receptive field
  geometrynet:
    hidden_layers: [128, 128, 128]
    phi_output: 4         # K, from the class table

field:                    # AUDIT 5: unused eps removed; the blend width is finetune.eps in the train config
  feature_cnn:            # LOCAL FIELDS: FieldFeatureCNN on W(t_n), stride 1, replicate padding; replaces Fourier(x~) + z_field
    conv_channels: [64, 64, 64, 64]   # ⚑ guess; plus a last linear conv into N_feat, so 5 layers
    N_feat: 32            # C_f, ⚑ guess; also the FiLM and coeff conditioning size
    kernel: 7             # 5 layers x (kernel // 2) = +-15 cells: covers the jump layer's reach from the far side
  fieldnet:
    regions: 4 #number of zones, also listed as K
    hidden_layers: [128, 128, 128, 128]
    field_output: 3
    # AUDIT 7: N_dist removed (always zeros)
    N_e: 8 # N_e-number ID for each zone k
    n_bases: 16 # ⚑ guess: shared bases per output
    

physics:
  constants:
    gamma: 1.4
  jump: 
    Mn_gate: 1.05
    speed_rel_tol: 0.01 # ⚑ interface_speed falls back to mean v.n below this relative density jump
    width: 5   # cells, constraint at full strength out to here; must be >= side_offset. Was 8; raw FieldNet error near plateau from 5 cells (raw_field_vs_distance, val + test_ood)
    taper: 2   # cells, cosine taper to 0 after width. Was 4; reach 7 + ~2 cells/step motion fits the +-9 geometry view
  fronts:
    tau_p: 0.10 #pressure-rise threshold for definingn a front as shock
    side_offset: 4 # cells, plateau read distance from the front; also the label check distance in front_distances, so a zone narrower than this has no front ⚑
  time:
    dt: 0.002
  scaling:
    rho_ref: 0.1
    u_ref: 1.0 #fill in with speed of sound
    P_ref: 0.1  # SOD
    Lx: 1.0
    Ly: 1.0
    t_ref: 0.24