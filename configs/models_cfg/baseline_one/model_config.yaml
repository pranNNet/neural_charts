# Model Parameters
# Read by ----- / ----- / Sod_Shock_Tube_Validation.py (all take --config).
name: baseline_1D
architecture:
  ablation:
    geometry: none  # levelset | none
    jump_mode: RH       # RH | free
    fourier: "on"       # on | off
    head: softplus      # softplus | linear
  latent:
    z_geo: 4
    z_field: 32
  coordinate_input: 2

encoder:
  encodernet:
    input: 1
    hidden_layers: [64, 64, 64]

geometry:
  norm_delta: 1.0e-2      # delta in phi_hat, x~ units
  fourierfeatures:
    seed: 0
    bands:
      - {n_freq: 16, sigma_x: 1.0, sigma_t: 0.5}
  geometrynet:
    hidden_layers: [128, 128, 128]
    phi_output: 5

field:
  eps: 0.004
  fourierfeatures:
    seed: 1
    bands:
      - {n_freq: 22, sigma_x: 1.0,  sigma_t: 0.5}
      - {n_freq: 21, sigma_x: 3.0,  sigma_t: 1.0}
      - {n_freq: 21, sigma_x: 10.0, sigma_t: 2.0}
  fieldnet:
    regions: 1 #number of zones, also listed as K
    hidden_layers: [166, 166, 166, 166]
    field_output: 3
    N_dist: 0 #distance features per interface
    N_e: 1 # N_e-number ID for each zone k
    

physics:
  constants:
    gamma: 1.4
  jump: 
    Mn_floor: 0.5
    Mn_gate: 1.05
    beta: 50.0
  fronts:
    N_search: 512
    search_chunk: null
    k: 3.125 #L/(2*T_ref*u_ref)
    tau_p: 0.05 #pressure-rise threshold for definingn a front as shock
    side_offset: 0.015625 # = 4 cells in x~ (4 · 2/512)
    t_min: 0.125 # t~ = 0.02 / 0.16
  scaling:
    rho_ref: 0.1
    u_ref: 1.0 #fill in with speed of sound
    P_ref: 0.1  # SOD
    Lx: 1.0
    Ly: 1.0
    t_ref: 0.24

